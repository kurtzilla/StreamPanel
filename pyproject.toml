[project]
name = "streampanel"
version = "0.0.0"
description = "StreamPanel"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "StreamPanel contributors" }]
dependencies = [
    "customtkinter>=5.2",
    "pillow>=10",
    "tkinterdnd2>=0.4",
]

[project.scripts]
streampanel = "streampanel.__main__:main"

[project.urls]
Repository = "https://github.com/kurtzilla/StreamPanel"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
